<!doctype html>
<html lang="en" >
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>NanospeedGamer</title>
    <link rel="stylesheet" href="style.css" />
    <script>
      /* Cache-bust: the PS4 browser serves HTTP-cached pages when it is
         relaunched.  A cb= stamp older than two minutes means this load is
         a restore -- replace with a fresh stamp so the page is fetched
         from the network again. */
      (function () {
        try {
          var m = location.search.match(/[?&]cb=(\d+)/);
          var now = Date.now();
          if (m && now - Number(m[1]) < 120000) return;
          var keep = location.search.replace(/[?&]cb=\d+/, "");
          location.replace(location.pathname + (keep ? keep + "&" : "?") + "cb=" + now);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <canvas id="matrix"></canvas>

    <div class="content">
      <img class="logo" src="logo.png" alt="Logo" />
      <h1>NanospeedGamer</h1>
      <p class="subtitle">PS4 14.00 · GoldHEN · 14.02 experimental (guarded)</p>
      <div id="crash-report" role="alert" hidden>
        <strong>Previous run did not finish</strong>
        <p id="crash-summary"></p>
        <button id="ack-crash" type="button">Acknowledge previous run</button>
      </div>
      <div id="diagnostic-test" hidden>
        <button id="test-storage" type="button">Test crash diagnostics</button>
        <p id="test-result"></p>
      </div>
      <p class="count" id="count">GoldHEN starts in 5 seconds...</p>
      <button id="start" type="button">Start GoldHEN now</button>
    </div>

    <script src="matrix.js?v=gh1402mem7"></script>
    <script src="breadcrumb.js?v=gh1402mem7"></script>
    <script src="launch.js?v=gh1402mem7"></script>
  </body>
  <script>
  if (window.applicationCache) {
    const app = window.applicationCache;
    const count = document.getElementById("count");
    app.addEventListener("downloading", () => {
      if (count) count.textContent = "Guardando caché...";
    });
    app.addEventListener("progress", e => {
      if (count && e.lengthComputable) {
        count.textContent = "Guardando caché... " + Math.round(e.loaded / e.total * 100) + "%";
      }
    });
    app.addEventListener("cached", () => {
      if (count) count.textContent = "Caché listo. Iniciando...";
    });
    app.addEventListener("noupdate", () => {
      if (count) count.textContent = "Caché listo. Iniciando...";
    });
  }
</script>
</html>
